<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متقدمة لصلاحيات المتصفح</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --granted: #10b981;
            --denied: #ef4444;
            --prompt: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            color: white;
            background: var(--prompt);
        }

        .status-granted { background-color: var(--granted); }
        .status-denied { background-color: var(--denied); }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 14px;
            transition: background 0.2s, transform 0.1s;
            flex: 1;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #64748b;
        }
        button.secondary:hover {
            background-color: #475569;
        }

        button.danger {
            background-color: var(--denied);
        }
        button.danger:hover {
            background-color: #dc2626;
        }

        .result {
            margin-top: 12px;
            font-size: 13px;
            color: #475569;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
            word-break: break-all;
        }

        video, canvas {
            width: 100%;
            max-height: 200px;
            border-radius: 6px;
            margin-top: 10px;
            background: #000;
            display: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h2>لوحة الصلاحيات التفاعلية المتقدمة</h2>
        <p>التحكم اللحظي وتتبع الصلاحيات في المتصفح</p>
    </header>

    <div class="container">
        <!-- 1. الموقع الجغرافي -->
        <div class="card">
            <h3>الموقع الجغرافي <span id="loc-status" class="status-badge">جارِ الفحص...</span></h3>
            <div>
                <div class="btn-group">
                    <button onclick="getCurrentLoc()">موقع مرة واحدة</button>
                    <button onclick="startWatchLoc()" class="secondary">تتبع مباشر</button>
                    <button onclick="stopWatchLoc()" class="danger">إيقاف التتبع</button>
                </div>
                <div id="loc-result" class="result">اضغط على أحد الخيارات للبدء.</div>
            </div>
        </div>

        <!-- 2. الإشعارات -->
        <div class="card">
            <h3>الإشعارات <span id="notif-status" class="status-badge">جارِ الفحص...</span></h3>
            <div>
                <div class="btn-group">
                    <button onclick="requestNotif()">طلب وتفعيل</button>
                    <button onclick="sendTestNotif()" class="secondary">إرسال إشعار تجريبي</button>
                </div>
                <div id="notif-result" class="result">قم بطلب الإذن لتفعيل الإشعارات.</div>
            </div>
        </div>

        <!-- 3. الكاميرا والصوت -->
        <div class="card">
            <h3>الكاميرا والصوت <span id="cam-status" class="status-badge">جارِ الفحص...</span></h3>
            <div>
                <div class="btn-group">
                    <button onclick="startCamera()">تشغيل الكاميرا</button>
                    <button onclick="takeSnapshot()" class="secondary">التقاط صورة</button>
                    <button onclick="stopCamera()" class="danger">إيقاف</button>
                </div>
                <video id="webcam" autoplay playsinline></video>
                <canvas id="snapshot" style="display:none;"></canvas>
                <div id="cam-result" class="result">الكاميرا متوقفة حالياً.</div>
            </div>
        </div>
    </div>

    <script>
        // رابط الخادم الخلفي الفعلي على منصة Render
        const BACKEND_URL = "https://my-backend-server-3kd5.onrender.com";

        // التحقق التلقائي من الصلاحيات عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            checkPermissionState('geolocation', 'loc-status');
            checkPermissionState('notifications', 'notif-status');
            checkPermissionState('camera', 'cam-status');
        });

        async function checkPermissionState(name, elementId) {
            const badge = document.getElementById(elementId);
            try {
                if (name === 'camera') name = 'video';
                const permission = await navigator.permissions.query({ name: name });
                updateBadge(badge, permission.state);
                
                permission.onchange = () => {
                    updateBadge(badge, permission.state);
                };
            } catch (e) {
                badge.innerText = "غير مدعوم";
            }
        }

        function updateBadge(badge, state) {
            badge.className = "status-badge";
            if (state === 'granted') {
                badge.innerText = "ممنوح";
                badge.classList.add('status-granted');
            } else if (state === 'denied') {
                badge.innerText = "مرفوض";
                badge.classList.add('status-denied');
            } else {
                badge.innerText = "يحتاج إذن";
            }
        }

        // إرسال الموقع إلى الخادم الخلفي
        function sendLocationToServer(lat, lon, acc) {
            fetch(`${BACKEND_URL}/api/location`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ latitude: lat, longitude: lon, accuracy: acc })
            })
            .then(res => res.json())
            .then(data => console.log('تم حفظ الموقع في الخادم:', data))
            .catch(err => console.error('خطأ في إرسال الموقع:', err));
        }

        // إرسال الصورة الملتقطة إلى الخادم الخلفي
        function sendSnapshotToServer(dataURL) {
            fetch(`${BACKEND_URL}/api/snapshot`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: dataURL })
            })
            .then(res => res.json())
            .then(data => console.log('تم حفظ الصورة في الخادم:', data))
            .catch(err => console.error('خطأ في إرسال الصورة:', err));
        }

        // --- 1. الموقع الجغرافي ---
        let watchId = null;

        function getCurrentLoc() {
            const res = document.getElementById("loc-result");
            if (!navigator.geolocation) return res.innerHTML = "المتصفح لا يدعم الميزة.";
            res.innerHTML = "جاري جلب الإحداثيات وإرسالها للخادم...";
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;
                    res.innerHTML = `خط العرض: ${lat.toFixed(4)}<br>خط الطول: ${lon.toFixed(4)}<br>الدقة: ${acc} متر`;
                    sendLocationToServer(lat, lon, acc);
                },
                err => res.innerHTML = `خطأ: ${err.message}`,
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function startWatchLoc() {
            const res = document.getElementById("loc-result");
            if (!navigator.geolocation) return;
            if (watchId !== null) return res.innerHTML = "التتبع يعمل بالفعل.";
            res.innerHTML = "جاري التتبع الحي للموقع...";
            watchId = navigator.geolocation.watchPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const acc = pos.coords.accuracy;
                    res.innerHTML = `[تتبع حي]<br>خط العرض: ${lat.toFixed(4)}<br>خط الطول: ${lon.toFixed(4)}`;
                    sendLocationToServer(lat, lon, acc);
                },
                err => res.innerHTML = `خطأ بالتتبع: ${err.message}`,
                { enableHighAccuracy: true }
            );
        }

        function stopWatchLoc() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                document.getElementById("loc-result").innerHTML = "تم إيقاف التتبع الحي.";
            }
        }

        // --- 2. الإشعارات ---
        function requestNotif() {
            const res = document.getElementById("notif-result");
            if (!("Notification" in window)) return res.innerHTML = "الإشعارات غير مدعومة.";
            Notification.requestPermission().then(perm => {
                res.innerHTML = `حالة الإشعارات: ${perm}`;
                checkPermissionState('notifications', 'notif-status');
            });
        }

        function sendTestNotif() {
            if (Notification.permission === "granted") {
                new Notification("إشعار تجريبي من اللوحة", {
                    body: "تم تفعيل نظام التنبيهات بنجاح!",
                });
            } else {
                alert("يرجى منح إذن الإشعارات أولاً.");
            }
        }

        // --- 3. الكاميرا ---
        let mediaStream = null;

        function startCamera() {
            const res = document.getElementById("cam-result");
            const video = document.getElementById("webcam");

            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then(stream => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    video.style.display = "block";
                    res.innerHTML = "تم فتح الكاميرا والميكروفون بنجاح.";
                    checkPermissionState('camera', 'cam-status');
                })
                .catch(err => {
                    res.innerHTML = `فشل التشغيل: ${err.message}`;
                });
        }

        function takeSnapshot() {
            const video = document.getElementById("webcam");
            const canvas = document.getElementById("snapshot");
            const res = document.getElementById("cam-result");

            if (!mediaStream) return alert("الكاميرا غير مفعلة.");
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.style.display = "block";
            
            const dataURL = canvas.toDataURL('image/png');
            sendSnapshotToServer(dataURL);
            res.innerHTML = "تم التقاط الصورة وإرسالها إلى الخادم بنجاح.";
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                document.getElementById("webcam").style.display = "none";
                document.getElementById("snapshot").style.display = "none";
                document.getElementById("cam-result").innerHTML = "تم إيقاف الكاميرا.";
            }
        }
    </script>

</body>
  </html>
